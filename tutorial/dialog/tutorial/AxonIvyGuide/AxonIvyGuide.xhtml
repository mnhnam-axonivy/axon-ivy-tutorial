<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<h:body>
  <ui:composition template="/layouts/frame-10-full-width.xhtml">
    <ui:define name="title">#{ivy.cms.co('/Dialogs/tutorial/AxonIvyGuide/PageTitle')}</ui:define>
    <ui:define name="content">

      <!-- Scripts generated by internal/axon_ivy_guide_builder (npm run build). The list of
           walkthroughs between the markers is written by the build as well. -->
      <h:outputScript library="js" name="marked.min.js" />
      <h:outputScript library="js" name="axon-ivy-guide-runtime.min.js" />
      <!-- walkthroughs:begin -->
      <h:outputScript library="js" name="walkthrough-2-1.js" />
      <h:outputScript library="js" name="walkthrough-2-2.js" />
      <h:outputScript library="js" name="walkthrough-2-3.js" />
      <h:outputScript library="js" name="walkthrough-2-4.js" />
      <h:outputScript library="js" name="walkthrough-2-5.js" />
      <h:outputScript library="js" name="walkthrough-3-1.js" />
      <h:outputScript library="js" name="walkthrough-3-10.js" />
      <h:outputScript library="js" name="walkthrough-3-11.js" />
      <h:outputScript library="js" name="walkthrough-3-2.js" />
      <h:outputScript library="js" name="walkthrough-3-3.js" />
      <h:outputScript library="js" name="walkthrough-3-4.js" />
      <h:outputScript library="js" name="walkthrough-3-5.js" />
      <h:outputScript library="js" name="walkthrough-3-6.js" />
      <h:outputScript library="js" name="walkthrough-3-7.js" />
      <h:outputScript library="js" name="walkthrough-3-8.js" />
      <h:outputScript library="js" name="walkthrough-3-9.js" />
      <!-- walkthroughs:end -->
      <h:outputScript library="js" name="axon-ivy-guide.js" />

      <!-- The element documents from the CMS (cms/Files/Elements), rendered by the page script. -->
      <div id="ivy-guide-docs" style="display:none">
        <ui:repeat value="#{guideBean.documents}" var="doc">
          <div data-doc="#{doc.name}" data-lang="#{doc.lang}">#{doc.text}</div>
        </ui:repeat>
      </div>

      <div id="ivy-guide" data-lang="#{guideBean.sessionLang}"></div>

    </ui:define>
  </ui:composition>
</h:body>
</html>
